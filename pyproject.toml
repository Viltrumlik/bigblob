[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bigblob"
version = "0.1.0"
description = "Find what is making the git repository big."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alisher Muhammadaliyev", email = "viltrumlik@gmail.com" }]
keywords = ["git", "repository-size", "history", "cleanup", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Viltrumlik/bigblob"
Issues = "https://github.com/Viltrumlik/bigblob/issues"

[project.scripts]
bigblob = "bigblob:main"

[tool.setuptools]
py-modules = ["bigblob"]
